services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_STORAGE_PATH: /data/papertrail.sqlite3
      MINERU_HOME: /models
      MINERU_MODEL_SOURCE: local
      MINERU_TELEMETRY_DISABLED: "1"
      PAPERTRAIL_PDF_PARSER: ${PAPERTRAIL_PDF_PARSER:-mineru}
      PAPERTRAIL_MINERU_TIER: ${PAPERTRAIL_MINERU_TIER:-standard}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-800}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-4}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_MAX_TOTAL_TOKENS: ${AGENT_MAX_TOTAL_TOKENS:-12000}
      AGENT_MAX_CONTEXT_CHARS: ${AGENT_MAX_CONTEXT_CHARS:-120000}
      AGENT_DEADLINE_SECONDS: ${AGENT_DEADLINE_SECONDS:-45}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-disabled}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_PRICE_PER_MILLION_USD: ${EMBEDDING_PRICE_PER_MILLION_USD:-}
    volumes:
      - papertrail-data:/data
      - papertrail-models:/models
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      PAPERTRAIL_API_BASE_URL: http://backend:8000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PAPERTRAIL_WEB_BIND:-127.0.0.1}:${PAPERTRAIL_WEB_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  papertrail-data:
  papertrail-models:
