name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
        env:
          POSTGRES_USER: computer
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: test_computer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U computer -d test_computer"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:8.2.9-bookworm@sha256:66b7f4c2f3c6ef1b298bbd7b13c806bc6f71e61f1136a4f58710daf2cb053b21
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://computer:ci-only-disposable@127.0.0.1:5432/test_computer
      TEST_DATABASE_URL: postgresql+psycopg://computer:ci-only-disposable@127.0.0.1:5432/test_computer
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      LLM_PROVIDER: disabled
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned package managers
        run: |
          python -m pip install uv==0.12.10
          npm install --global pnpm@11.19.0
      - name: Locked install
        run: |
          uv sync --directory backend --frozen
          pnpm --dir web install --frozen-lockfile
      - name: Foundation records
        run: |
          python scripts/check_foundation.py
          python scripts/check_source_review.py
      - name: Backend lint and real PostgreSQL / Redis integration
        working-directory: backend
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen pytest -q
          uv run --frozen alembic upgrade head
          uv run --frozen python -m tools.export_openapi
      - name: OpenAPI client and front-end build
        working-directory: web
        run: |
          pnpm run api:generate
          git diff --exit-code -- ../docs/openapi.json lib/api/schema.d.ts
          pnpm run typecheck
          pnpm run format:check
          pnpm run build
      - name: Dependency audit
        run: |
          uv run --directory backend --frozen pip-audit --progress-spinner off
          pnpm --dir web audit --audit-level moderate
      - name: Real API browser flows
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
