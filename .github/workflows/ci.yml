name: PaperTrail CI

on:
  push:
    paths:
      - "**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: papertrail-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Locked install, lint, tests, and OpenAPI contract
        working-directory: backend
        run: |
          uv sync --locked --all-groups
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest -q
          uv run --locked python -m tools.export_openapi
          git -C .. diff --exit-code -- docs/openapi.json

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Format, typecheck, and production build
        working-directory: web
        run: |
          pnpm run format:check
          pnpm run typecheck
          pnpm run build
      - name: Browser E2E
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
