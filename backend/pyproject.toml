[project]
name = "computer-recommend-api"
version = "0.1.0"
description = "Evidence-first computer recommendation API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.8", "pip-audit==2.10.1"]

[tool.uv]
required-version = "==0.12.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an explicitly supplied empty PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
